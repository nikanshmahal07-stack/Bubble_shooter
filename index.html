<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>BUBBLE SHOOTER</title>
<style>
body{margin:0;background:#150033;color:#fff;font-family:Arial;text-align:center;touch-action:none;overflow:hidden}
h2{background:#FFEB3B;color:#000;margin:0;padding:10px;font-size:20px}
#top{display:flex;justify-content:space-around;background:#2a0a5e;padding:8px;font-weight:bold}
canvas{background:#1e0b4a;border:3px solid #FFEB3B;border-radius:12px;margin-top:8px;touch-action:none}
button{margin-top:8px;padding:10px 22px;background:#00E676;border:none;border-radius:20px;font-weight:bold;font-size:15px}
p{font-size:13px;opacity:.8}
</style>
</head>
<body>
<h2>🎯 BUBBLE SHOOTER 🎯</h2>
<div id="top"><span id="s">SCORE: 0</span><span id="l">LEVEL: 1</span></div>
<canvas id="c" width="360" height="520"></canvas>
<br><button onclick="location.reload()">🔄 RESTART</button>
<p>👆 Upar wale Bubble pe Touch karo, Bubble apne aap chalega!</p>
<script>
var cv=document.getElementById("c"), ctx=cv.getContext("2d");
var COL=["#FF3D00","#2979FF","#00E676","#FFEA00","#FF4081","#00E5FF"];
var R=17, COLS=9, grid=[], score=0, level=1;
var shooter={x:180,y:485,c:COL[0],n:COL[1]};
var bullet=null, aimX=180, aimY=100, aiming=false;

function newGame(){
  grid=[];
  for(var y=0;y<5;y++){ grid[y]=[]; for(var x=0;x<COLS;x++){ grid[y][x]= Math.random()<0.95 ? COL[Math.floor(Math.random()*4)] : null; } }
}
function P(x,y){ var off=(y%2)*R; return {px:22+off+x*(R*2+3), py:28+y*(R*2-3)}; }
function drawB(x,y,c){
  ctx.beginPath(); ctx.arc(x,y,R,0,7); ctx.fillStyle=c; ctx.fill();
  ctx.lineWidth=2; ctx.strokeStyle="#fff"; ctx.stroke();
  ctx.beginPath(); ctx.arc(x-5,y-6,4,0,7); ctx.fillStyle="rgba(255,255,255,.6)"; ctx.fill();
}
function draw(){
  ctx.clearRect(0,0,360,520);
  // AIM LINE
  if(aiming){
    ctx.setLineDash([6,6]); ctx.strokeStyle="rgba(255,255,255,.6)"; ctx.lineWidth=2;
    ctx.beginPath(); ctx.moveTo(shooter.x,shooter.y); ctx.lineTo(aimX,aimY); ctx.stroke(); ctx.setLineDash([]);
  }
  for(var y=0;y<grid.length;y++) for(var x=0;x<COLS;x++){ if(!grid[y][x]) continue; var p=P(x,y); drawB(p.px,p.py,grid[y][x]); }
  drawB(shooter.x,shooter.y,shooter.c);
  drawB(315,485,shooter.n);
  ctx.fillStyle="#fff"; ctx.font="bold 10px Arial"; ctx.fillText("NEXT",303,512);
  if(bullet) drawB(bullet.x,bullet.y,bullet.c);
}
function shoot(){
  if(bullet) return;
  var ang=Math.atan2(aimY-shooter.y, aimX-shooter.x);
  // upar ki taraf hi jaye
  if(ang>-0.2) ang=-0.4; if(ang<-2.9) ang=-2.7;
  bullet={x:shooter.x,y:shooter.y,c:shooter.c,dx:Math.cos(ang)*7,dy:Math.sin(ang)*7};
  shooter.c=shooter.n; shooter.n=COL[Math.floor(Math.random()*COL.length)];
}
function place(){
  var best=null, bd=99999;
  for(var y=0;y<12;y++) for(var x=0;x<COLS;x++){ var p=P(x,y); var d=Math.hypot(bullet.x-p.px,bullet.y-p.py); if(d<bd){bd=d;best={x:x,y:y};} }
  if(best){ if(!grid[best.y]) grid[best.y]=[]; grid[best.y][best.x]=bullet.c; check(best.x,best.y,bullet.c); }
  bullet=null;
  document.getElementById("s").innerText="SCORE: "+score;
  var left=0; grid.forEach(r=>r.forEach(c=>{if(c)left++}));
  if(left==0){ level++; document.getElementById("l").innerText="LEVEL: "+level; alert("Level Clear! Ab Level "+level); newGame(); }
}
function check(sx,sy,col){
  var seen={}, stack=[[sx,sy]], got=[];
  while(stack.length){ var a=stack.pop(); var x=a[0],y=a[1]; var k=x+","+y; if(seen[k]) continue; seen[k]=1; if(!grid[y]||grid[y][x]!==col) continue; got.push([x,y]);
    stack.push([x+1,y],[x-1,y],[x,y+1],[x,y-1],[x+1,y+1],[x-1,y-1]);
  }
  if(got.length>=3){ got.forEach(function(g){ grid[g[1]][g[0]]=null; }); score+=got.length*10; }
}
function getPos(e){
  var r=cv.getBoundingClientRect();
  var t=e.touches?e.touches[0]:e;
  return {x:t.clientX-r.left, y:t.clientY-r.top};
}
// TOUCH - dabao, ghumao, chhodo = shoot
cv.addEventListener("touchstart",function(e){ e.preventDefault(); var p=getPos(e); aimX=p.x; aimY=p.y; aiming=true; },{passive:false});
cv.addEventListener("touchmove",function(e){ e.preventDefault(); var p=getPos(e); aimX=p.x; aimY=p.y; },{passive:false});
cv.addEventListener("touchend",function(e){ e.preventDefault(); aiming=false; shoot(); },{passive:false});
// MOUSE ke liye bhi
cv.addEventListener("mousemove",function(e){ var p=getPos(e); aimX=p.x; aimY=p.y; aiming=true; });
cv.addEventListener("click",function(e){ var p=getPos(e); aimX=p.x; aimY=p.y; shoot(); });

function loop(){
  if(bullet){
    bullet.x+=bullet.dx; bullet.y+=bullet.dy;
    if(bullet.x<18||bullet.x>342) bullet.dx*=-1;
    if(bullet.y<28){ place(); }
    else{
      outer: for(var y=0;y<grid.length;y++) for(var x=0;x<COLS;x++){ if(!grid[y][x]) continue; var p=P(x,y); if(Math.hypot(bullet.x-p.px,bullet.y-p.py)<R*1.9){ place(); break outer; } }
    }
  }
  draw(); requestAnimationFrame(loop);
}
newGame(); loop();
</script>
</body>
</html>
