<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Bubble Shooter</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#FFD93D;background:linear-gradient(#FFD93D,#FF6B6B);font-family:Arial;text-align:center;overflow:hidden;touch-action:none}
.logo{background:#fff;padding:8px;display:flex;align-items:center;justify-content:center;gap:8px}
.logo-icon{width:45px;height:45px;background:linear-gradient(#FF4081,#7C4DFF);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:26px;border:3px solid #FFEB3B}
.logo h1{font-size:20px;line-height:1;text-align:left;color:#333}
.logo h1 span{color:#FF3D00}
.logo p{font-size:10px;color:#888}
.top{display:flex;justify-content:space-between;padding:8px 12px;font-weight:900;font-size:13px}
.top span{background:#fff;padding:5px 12px;border-radius:20px}
canvas{background:linear-gradient(#7EC8FF,#E0F7FF);border:3px solid #fff;border-radius:15px;margin-top:2px;touch-action:none;display:none}
#map{padding:10px;display:grid;grid-template-columns:repeat(5,1fr);gap:8px;max-width:360px;margin:10px auto}
.lvl{width:55px;height:55px;border-radius:50%;border:3px solid #fff;font-weight:900;font-size:16px;box-shadow:0 3px 0 rgba(0,0,0,.3)}
.lvl.open{background:#00E676}.lvl.lock{background:#ccc;color:#666}.lvl.cur{background:#FFEB3B;animation:bounce 1s infinite}
@keyframes bounce{0%,100%{transform:scale(1)}50%{transform:scale(1.1)}}
.btns{display:none;justify-content:center;gap:8px;margin-top:5px}
button{padding:10px 14px;border:none;border-radius:25px;font-weight:900;font-size:13px;box-shadow:0 3px 0 rgba(0,0,0,.3)}
#back{margin-top:10px;background:#fff;padding:8px 20px;border-radius:20px;font-weight:900;border:none}
#msg{position:fixed;top:45%;left:50%;transform:translate(-50%,-50%);font-size:32px;font-weight:900;color:#fff;text-shadow:3px 3px 0 #000;display:none;z-index:99}
</style>
</head>
<body>
<div id="msg">💣 BOOM!</div>
<div class="logo"><div class="logo-icon">🫧</div><div><h1><span>BUBBLE</span> SHOOTER</h1><p>⭐ PRO VERSION - 50 LEVELS ⭐</p></div><div class="logo-icon" style="background:linear-gradient(#00E676,#2979FF)">🐱</div></div>
<div class="top"><span>⭐ <b id="stars">0</b></span><span>🪙 <b id="coins">100</b></span><span>🔥 COMBO: <b id="combo">0</b></span><span>🔊 <b id="sndBtn" onclick="toggleSound()" style="cursor:pointer">ON</b></span></div>
<div id="mapScreen"><h2 style="color:#fff;text-shadow:2px 2px 0 #000;margin:8px">🗺️ LEVEL CHUNO 🗺️</h2><div id="map"></div><p style="color:#fff;font-weight:bold;font-size:12px">🏹 Arrow se Aim karo | ⬇️ Latke Bubble Girenge | 🔥 5 Combo = Fireball</p></div>
<canvas id="c" width="360" height="500"></canvas>
<div class="btns" id="btns"><button style="background:#FF5252;color:#fff" onclick="useBomb()">💣 BOMB</button><button style="background:#448AFF;color:#fff" onclick="changeColor()">🎨 COLOUR</button><button style="background:#00E676" onclick="showMap()">🗺️ MAP</button></div>
<button id="back" onclick="showMap()" style="display:none">⬅ BACK TO MAP</button>
<script>
var soundOn=true, audioCtx=null;
function playSound(t){
  if(!soundOn) return;
  try{
    if(!audioCtx) audioCtx=new (window.AudioContext||window.webkitAudioContext)();
    var o=audioCtx.createOscillator(), g=audioCtx.createGain(); o.connect(g); g.connect(audioCtx.destination);
    if(t=='shoot'){ o.frequency.value=500; o.type='sine'; g.gain.value=0.15; o.start(); o.frequency.exponentialRampToValueAtTime(900,audioCtx.currentTime+0.1); o.stop(audioCtx.currentTime+0.12); }
    if(t=='pop'){ o.frequency.value=800; o.type='square'; g.gain.value=0.12; o.start(); o.frequency.exponentialRampToValueAtTime(200,audioCtx.currentTime+0.15); o.stop(audioCtx.currentTime+0.18); }
    if(t=='fall'){ o.frequency.value=600; o.type='triangle'; g.gain.value=0.12; o.start(); o.frequency.exponentialRampToValueAtTime(100,audioCtx.currentTime+0.3); o.stop(audioCtx.currentTime+0.35); }
    if(t=='bomb'){ o.frequency.value=150; o.type='sawtooth'; g.gain.value=0.25; o.start(); o.frequency.exponentialRampToValueAtTime(40,audioCtx.currentTime+0.4); o.stop(audioCtx.currentTime+0.45); }
    if(t=='fire'){ o.frequency.value=1000; o.type='sawtooth'; g.gain.value=0.15; o.start(); o.frequency.exponentialRampToValueAtTime(2000,audioCtx.currentTime+0.3); o.stop(audioCtx.currentTime+0.35); }
    if(t=='win'){ [523,659,784,1046].forEach((f,i)=>{ var o2=audioCtx.createOscillator(), g2=audioCtx.createGain(); o2.connect(g2); g2.connect(audioCtx.destination); o2.frequency.value=f; o2.start(audioCtx.currentTime+i*0.15); o2.stop(audioCtx.currentTime+i*0.15+0.2); }); }
  }catch(e){}
}
function toggleSound(){ soundOn=!soundOn; document.getElementById("sndBtn").innerText=soundOn?"ON":"OFF"; }
function showMsg(txt){ var m=document.getElementById("msg"); m.innerText=txt; m.style.display="block"; setTimeout(()=>m.style.display="none",1200); }

var cv=document.getElementById("c"), ctx=cv.getContext("2d");
var COL=["#FF3D00","#2979FF","#00C853","#FFEA00","#D500F9","#00BCD4"];
var R=17, COLS=9, grid=[], score=0, level=1, moves=30, coins=100, stars=0, unlocked=1, combo=0, fireballNext=false;
var shooter={x:180,y:435,c:COL[0],n:COL[1]};
var bullet=null, aimX=180, aimY=100, aiming=false, falling=[], particles=[];
var aimAngle=-Math.PI/2;

function buildMap(){ var m=document.getElementById("map"); m.innerHTML=""; for(var i=1;i<=50;i++){ var b=document.createElement("button"); b.className="lvl "+(i<unlocked?"open": i==unlocked?"cur":"lock"); b.innerText=i<=unlocked?i:"🔒"; if(i<=unlocked){ (function(l){ b.onclick=function(){ startLevel(l); }; })(i); } m.appendChild(b); } }
function showMap(){ document.getElementById("mapScreen").style.display="block"; cv.style.display="none"; document.getElementById("btns").style.display="none"; document.getElementById("back").style.display="none"; buildMap(); }
function startLevel(l){ level=l; document.getElementById("mapScreen").style.display="none"; cv.style.display="block"; document.getElementById("btns").style.display="flex"; document.getElementById("back").style.display="inline-block"; newGame(); }
function newGame(){
  grid=[]; moves=25+level*2; if(moves>40) moves=40; combo=0; fireballNext=false; falling=[];
  var cc = level<3?3: level<10?4: level<25?5:6;
  var rows = level<5?5: level<15?6:7;
  for(var y=0;y<rows;y++){ grid[y]=[]; for(var x=0;x<COLS;x++){ grid[y][x]= Math.random()<0.94 ? COL[Math.floor(Math.random()*cc)] : null; } }
  update();
}
function update(){ document.getElementById("coins").innerText=coins; document.getElementById("stars").innerText=stars; document.getElementById("combo").innerText=combo+(fireballNext?" 🔥":""); }
function P(x,y){ var off=(y%2)*R; return {px:22+off+x*(R*2+3), py:28+y*(R*2-3)}; }
function drawB(x,y,c,isFire){
  ctx.beginPath(); ctx.arc(x,y,R,0,7); ctx.fillStyle=c; ctx.fill();
  ctx.lineWidth=2.5; ctx.strokeStyle=isFire?"#FFEA00":"#fff"; ctx.stroke();
  ctx.beginPath(); ctx.arc(x-5,y-6,5,0,7); ctx.fillStyle="rgba(255,255,255,.7)"; ctx.fill();
  if(isFire){ ctx.font="16px Arial"; ctx.fillText("🔥",x-8,y+6); }
}
function draw(){
  if(cv.style.display=="none") return;
  ctx.clearRect(0,0,360,500);
  ctx.font="18px Arial"; ctx.fillText("☁️",20,20); ctx.fillText("☁️",300,15);
  ctx.fillStyle="#333"; ctx.font="bold 13px Arial"; ctx.fillText("LEVEL "+level+"  |  Moves: "+moves+"  |  Score: "+score, 70, 20);
  // ==== ARROW GHUMEGA ====
  // Dotted line + Arrow head jo Aim ke saath ghumta hai
  ctx.save(); ctx.translate(shooter.x, shooter.y-18); ctx.rotate(aimAngle+Math.PI/2);
  ctx.setLineDash([6,6]); ctx.strokeStyle= fireballNext?"#FF3D00":"rgba(255,255,255,.9)"; ctx.lineWidth=3;
  ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(0,-70); ctx.stroke(); ctx.setLineDash([]);
  // Arrow ka teer
  ctx.fillStyle= fireballNext?"#FF3D00":"#fff"; ctx.beginPath(); ctx.moveTo(0,-85); ctx.lineTo(-8,-70); ctx.lineTo(8,-70); ctx.closePath(); ctx.fill();
  ctx.strokeStyle="#333"; ctx.stroke();
  ctx.restore();

  for(var y=0;y<grid.length;y++) for(var x=0;x<COLS;x++){ if(!grid[y][x]) continue; var p=P(x,y); drawB(p.px,p.py,grid[y][x],false); }
  // Girte hue bubble
  falling.forEach(f=>{ drawB(f.x,f.y,f.c,false); });
  // Particles
  particles.forEach(p=>{ ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,7); ctx.fillStyle=p.c; ctx.fill(); });
  ctx.font="48px Arial"; ctx.fillText("🐱",152,495);
  // Shooter - Fireball ho to Aag wala
  if(fireballNext){ drawB(shooter.x,shooter.y-18,"#FF3D00",true); } else { drawB(shooter.x,shooter.y-18,shooter.c,false); }
  drawB(315,460,shooter.n,false);
  ctx.fillStyle="#333"; ctx.font="bold 10px Arial"; ctx.fillText("NEXT",303,485);
  if(bullet) drawB(bullet.x,bullet.y,bullet.c,bullet.isFire);
}
function useBomb(){ if(coins<20){ alert("20 Coin chahiye!"); return; } coins-=20; playSound('bomb'); showMsg("💣 BOOM!"); for(var y=0;y<3;y++) for(var x=3;x<6;x++){ if(grid[y]&&grid[y][x]) grid[y][x]=null; } score+=50; update(); checkFloating(); }
function changeColor(){ if(coins<10){ alert("10 Coin chahiye!"); return; } coins-=10; shooter.c=COL[Math.floor(Math.random()*COL.length)]; update(); }
function shoot(){
  if(bullet||moves<=0) return;
  var ang=aimAngle;
  var isFire=fireballNext;
  if(isFire){ playSound('fire'); showMsg("🔥 FIREBALL!"); fireballNext=false; }
  else playSound('shoot');
  bullet={x:shooter.x,y:shooter.y-18,c: isFire?"#FF3D00":shooter.c,dx:Math.cos(ang)*7,dy:Math.sin(ang)*7, isFire:isFire};
  shooter.c=shooter.n; shooter.n=COL[Math.floor(Math.random()*COL.length)];
  moves--;
}
function place(){
  var best=null, bd=99999;
  for(var y=0;y<12;y++) for(var x=0;x<COLS;x++){ var p=P(x,y); var d=Math.hypot(bullet.x-p.px,bullet.y-p.py); if(d<bd){bd=d;best={x:x,y:y};} }
  var wasFire=bullet.isFire;
  if(best){ if(!grid[best.y]) grid[best.y]=[]; 
    if(wasFire){
      // FIREBALL - Aas paas ke saare phod de
      for(var dy=-1;dy<=1;dy++) for(var dx=-1;dx<=1;dx++){ var nx=best.x+dx, ny=best.y+dy; if(grid[ny]&&grid[ny][nx]){ grid[ny][nx]=null; score+=20; } }
      combo=0; showMsg("🔥 FIRE BLAST!");
    } else {
      grid[best.y][best.x]=bullet.c; check(best.x,best.y,bullet.c);
    }
  }
  bullet=null;
  checkFloating();
  var left=0; grid.forEach(r=>r.forEach(c=>{if(c)left++}));
  if(left==0){ var s=moves>15?3:moves>5?2:1; stars+=s; coins+=30; playSound('win'); if(level==unlocked&&unlocked<50) unlocked++; alert("🎉 LEVEL "+level+" CLEAR! ⭐ "+s+" Star! +30 Coin!"); showMap(); }
  else if(moves<=0){ alert("😿 GAME OVER! Moves Khatam!"); showMap(); }
  update();
}
// ==== MATCH + FLOATING CHECK ====
function check(sx,sy,col){
  var seen={}, stack=[[sx,sy]], got=[];
  while(stack.length){ var a=stack.pop(); var x=a[0],y=a[1]; var k=x+","+y; if(seen[k]) continue; seen[k]=1; if(!grid[y]||grid[y][x]!==col) continue; got.push([x,y]); stack.push([x+1,y],[x-1,y],[x,y+1],[x,y-1],[x+1,y+1],[x-1,y-1]); }
  if(got.length>=3){
    got.forEach(g=>{ grid[g[1]][g[0]]=null; }); score+=got.length*10; coins+=2; combo++; playSound('pop');
    if(combo>=5){ fireballNext=true; combo=5; showMsg("🔥 FIREBALL READY!"); playSound('fire'); }
  } else {
    combo=0; // miss hua to combo toot gaya
  }
}
// ==== JO UPAR SE CONNECT NAHI HAI, WO GIR JAYEGA ====
function checkFloating(){
  // Top row se connected dhoondo
  var connected={};
  var stack=[];
  for(var x=0;x<COLS;x++){ if(grid[0]&&grid[0][x]) stack.push([x,0]); }
  while(stack.length){ var a=stack.pop(); var x=a[0],y=a[1]; var k=x+","+y; if(connected[k]) continue; connected[k]=1; if(!grid[y]||!grid[y][x]) continue;
    [[1,0],[-1,0],[0,1],[0,-1],[1,1],[-1,-1]].forEach(d=>{ var nx=x+d[0], ny=y+d[1]; if(grid[ny]&&grid[ny][nx]) stack.push([nx,ny]); });
  }
  var floatingCount=0;
  for(var y=0;y<grid.length;y++) for(var x=0;x<COLS;x++){
    if(grid[y]&&grid[y][x]&&!connected[x+","+y]){
      var p=P(x,y);
      falling.push({x:p.px,y:p.py,c:grid[y][x],vy:3+Math.random()*2});
      grid[y][x]=null; floatingCount++;
    }
  }
  if(floatingCount>0){
    playSound('fall'); score+=floatingCount*15; coins+=floatingCount;
    // ==== 10 SATH GIRE TO BOMB ====
    if(floatingCount>=10){
      playSound('bomb'); showMsg("💣 10 GIRE = MEGA BOMB!");
      setTimeout(()=>{
        for(var i=0;i<10;i++){ var ry=Math.floor(Math.random()*grid.length), rx=Math.floor(Math.random()*COLS); if(grid[ry]&&grid[ry][rx]) grid[ry][rx]=null; }
        score+=100; coins+=20; update();
      },500);
    }
  }
}
function getPos(e){ var r=cv.getBoundingClientRect(); var t=e.touches?e.touches[0]:e; return {x:t.clientX-r.left, y:t.clientY-r.top}; }
function updateAim(p){
  aimX=p.x; aimY=p.y;
  aimAngle=Math.atan2(p.y-(shooter.y-18), p.x-shooter.x);
  if(aimAngle>-0.2) aimAngle=-0.4; if(aimAngle<-2.9) aimAngle=-2.7;
}
cv.addEventListener("touchstart",function(e){ e.preventDefault(); updateAim(getPos(e)); aiming=true; },{passive:false});
cv.addEventListener("touchmove",function(e){ e.preventDefault(); updateAim(getPos(e)); },{passive:false});
cv.addEventListener("touchend",function(e){ e.preventDefault(); aiming=false; shoot(); },{passive:false});
cv.addEventListener("mousemove",function(e){ updateAim(getPos(e)); aiming=true; });
cv.addEventListener("click",function(e){ updateAim(getPos(e)); shoot(); });
function loop(){
  if(bullet){
    bullet.x+=bullet.dx; bullet.y+=bullet.dy;
    if(bullet.x<18||bullet.x>342) bullet.dx*=-1;
    if(bullet.y<28){ place(); }
    else{
      outer: for(var y=0;y<grid.length;y++) for(var x=0;x<COLS;x++){ if(!grid[y][x]) continue; var p=P(x,y); if(Math.hypot(bullet.x-p.px,bullet.y-p.py)<R*1.9){ place(); break outer; } }
    }
  }
  // Girte hue bubble ka animation
  falling.forEach(f=>{ f.y+=f.vy; f.vy+=0.2; });
  falling=falling.filter(f=>f.y<520);
  draw(); requestAnimationFrame(loop);
}
buildMap(); loop();
</script>
</body>
</html>
