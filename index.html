<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>BUBBLE SHOOTER - OFFLINE</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:#12002e;font-family:Arial;color:white;text-align:center;overflow:hidden}
.top{background:#ffeb3b;color:#000;padding:8px;font-weight:900;font-size:20px}
.bar{display:flex;justify-content:space-between;padding:8px 15px;background:#2a0a5e;font-weight:bold}
#game{width:360px;height:540px;background:#1e0b4a;border:3px solid #ffeb3b;border-radius:15px;display:block;margin:8px auto;touch-action:none}
.btn{padding:12px 25px;background:#00e676;border:none;border-radius:30px;font-weight:900;font-size:16px;margin-top:2px}
.small{font-size:12px;opacity:0.8;margin-top:5px}
</style>
</head>
<body>
<div class="top">🎯 BUBBLE SHOOTER - OFFLINE 🎯</div>
<div class="bar"><span id="score">SCORE : 0</span><span id="level">LEVEL : 1</span><span id="left">LEFT : 0</span></div>
<canvas id="game" width="360" height="540"></canvas>
<button class="btn" onclick="location.reload()">🔄 NEW GAME</button>
<div class="small">👆 Bubble ko Touch karke Aim karo - 3 Same Colour = Blast!</div>

<script>
// OFFLINE - Koi Internet Nahi Chahiye
let cv=document.getElementById("game"), ctx=cv.getContext("2d");
let COLORS=["#FF3D00","#2979FF","#00E676","#FFEA00","#FF4081","#00E5FF"];
let R=17, COLS=9;
let grid=[], score=0, level=1;
let shooter={x:180,y:505,color:COLORS[0], next:COLORS[1]};
let bullet=null, gameOver=false;

function makeLevel(){
  grid=[];
  let rows = 5 + level;
  if(rows>8) rows=8;
  for(let y=0;y<rows;y++){
    grid[y]=[];
    for(let x=0;x<COLS;x++){
      // thoda gap rakho taaki game aasan lage
      grid[y][x]= Math.random()<0.92 ? COLORS[Math.floor(Math.random()*Math.min(3+level,6))] : null;
    }
  }
  updateUI();
}
function updateUI(){
  let left=0; grid.forEach(r=>r.forEach(c=>{if(c)left++}));
  document.getElementById("score").innerText="SCORE : "+score;
  document.getElementById("level").innerText="LEVEL : "+level;
  document.getElementById("left").innerText="LEFT : "+left;
  if(left===0){ level++; alert("🎉 LEVEL "+(level-1)+" CLEAR! Ab Level "+level); makeLevel(); }
}
function pos(x,y){ let off=(y%2)*R; return {px:22+off+x*(R*2+3), py:30+y*(R*2-3)}; }
function drawBubble(x,y,color){
  ctx.beginPath(); ctx.arc(x,y,R,0,7); ctx.fillStyle=color; ctx.fill();
  ctx.strokeStyle="rgba(255,255,255,0.9)"; ctx.lineWidth=2; ctx.stroke();
  ctx.beginPath(); ctx.arc(x-5,y-6,5,0,7); ctx.fillStyle="rgba(255,255,255,0.5)"; ctx.fill();
}
function draw(){
  ctx.clearRect(0,0,360,540);
  // aim line
  ctx.setLineDash([5,5]); ctx.strokeStyle="rgba(255,255,255,0.3)";
  ctx.beginPath(); ctx.moveTo(shooter.x,shooter.y); ctx.lineTo(shooter.x,60); ctx.stroke(); ctx.setLineDash([]);
  for(let y=0;y<grid.length;y++) for(let x=0;x<COLS;x++){ if(!grid[y][x])continue; let p=pos(x,y); drawBubble(p.px,p.py,grid[y][x]); }
  drawBubble(shooter.x,shooter.y,shooter.color);
  drawBubble(310,505,shooter.next);
  ctx.fillStyle="white"; ctx.font="bold 11px Arial"; ctx.fillText("NEXT",300,535);
  if(bullet) drawBubble(bullet.x,bullet.y,bullet.color);
  if(gameOver){ ctx.fillStyle="rgba(0,0,0,0.8)"; ctx.fillRect(0,0,360,540); ctx.fillStyle="#FFEB3B"; ctx.font="bold 28px Arial"; ctx.fillText("GAME OVER!",90,250); ctx.fillStyle="white"; ctx.font="bold 18px Arial"; ctx.fillText("Score: "+score,130,290); }
}
function shoot(tx,ty){
  if(bullet||gameOver) return;
  let ang=Math.atan2(ty-shooter.y,tx-shooter.x);
  if(ang>-0.15) ang=-0.4; if(ang<-2.95) ang=-2.7;
  bullet={x:shooter.x,y:shooter.y,color:shooter.color,dx:Math.cos(ang)*8,dy:Math.sin(ang)*8};
  shooter.color=shooter.next;
  shooter.next=COLORS[Math.floor(Math.random()*COLORS.length)];
}
function place(){
  if(!bullet) return;
  let best=null,bd=9999;
  for(let y=0;y<11;y++) for(let x=0;x<COLS;x++){ let p=pos(x,y); let d=Math.hypot(bullet.x-p.px,bullet.y-p.py); if(d<bd){bd=d;best={x,y};} }
  if(best){ if(!grid[best.y]) grid[best.y]=[]; grid[best.y][best.x]=bullet.color; popCheck(best.x,best.y,bullet.color); }
  bullet=null;
  // check game over - bubble neeche aa gaya?
  for(let y=0;y<grid.length;y++) for(let x=0;x<COLS;x++){ if(grid[y][x]){ let p=pos(x,y); if(p.py>470) gameOver=true; } }
  updateUI();
}
function popCheck(sx,sy,col){
  let seen={},stack=[[sx,sy]],matched=[];
  while(stack.length){ let [x,y]=stack.pop(); let k=x+","+y; if(seen[k])continue; seen[k]=1; if(!grid[y]||grid[y][x]!==col)continue; matched.push([x,y]); [[1,0],[-1,0],[0,1],[0,-1],[1,1],[-1,-1]].forEach(([dx,dy])=>stack.push([x+dx,y+dy])); }
  if(matched.length>=3){ matched.forEach(([x,y])=>grid[y][x]=null); score+=matched.length*10; if(matched.length>=5) score+=50; }
}
function loop(){
  if(bullet){
    bullet.x+=bullet.dx; bullet.y+=bullet.dy;
    if(bullet.x<18||bullet.x>342) bullet.dx*=-1;
    if(bullet.y<25) place();
    else{
      for(let y=0;y<grid.length;y++) for(let x=0;x<COLS;x++){ if(!grid[y][x])continue; let p=pos(x,y); if(Math.hypot(bullet.x-p.px,bullet.y-p.py)<R*1.8){ place(); break; } }
    }
  }
  draw(); requestAnimationFrame(loop);
}
cv.addEventListener("touchstart",e=>{ e.preventDefault(); let r=cv.getBoundingClientRect(); shoot(e.touches[0].clientX-r.left, e.touches[0].clientY-r.top); },{passive:false});
cv.addEventListener("mousedown",e=>{ let r=cv.getBoundingClientRect(); shoot(e.clientX-r.left, e.clientY-r.top); });
makeLevel(); loop();
</script>
</body>
  </html>
